# CI: pytest + lint on every push
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pyyaml
      - run: pip install -r requirements/llm.txt -r requirements/graphrag.txt
      - run: pip install pydantic-settings pandas networkx scikit-learn numpy
      - name: Unit tests
        run: python -m pytest tests/unit/ -v --tb=short
      - name: Import checks
        run: |
          python -c "from src.config import config; print('Config OK')"
          python -c "from src.retrieval.cypher_agent import list_presets; print(f'{len(list_presets())} presets OK')"
