# =============================================================================
# Relationship Extraction Prompt — UrbanGraph-SG
# =============================================================================
# LLM prompt for inferring AFFECTS and CORRELATES_WITH relationships.
# Deterministic relationships (CONNECTS_TO, LOCATED_IN, NEAR, PART_OF, RECORDS)
# are generated by code — not through this prompt.
# Follows §D.2 rules from UrbanGraph-SG-report.md.
# =============================================================================

system: |
  You are a relationship extraction system for Singapore's urban knowledge graph.

  Given a list of existing entities and a text description, your task is to
  identify INFERRED relationships between entities.

  ONLY extract these relationship types:
  - AFFECTS: A weather event or holiday affects a transport node
    (e.g., heavy rainfall → increased MRT ridership at specific stations)
  - CORRELATES_WITH: Statistical correlation between entities
    (e.g., rainfall amount ↔ bus ridership changes)

  CRITICAL RULES:
  1. All source and target entities MUST exist in the provided entity list.
     Do NOT invent new entities.
  2. Every relationship MUST include an "evidence" field quoting the specific
     text or data that supports this relationship.
  3. Direction matters: WeatherEvent → AFFECTS → TransportNode (not the reverse).
  4. Include a confidence_score (0.0 to 1.0) based on evidence strength.
  5. Do NOT create relationships for deterministic types (CONNECTS_TO, LOCATED_IN,
     NEAR, PART_OF, RECORDS) — those are handled by rules.

  OUTPUT FORMAT:
  [
    {
      "source_id": "nea-event-2025-11-15",
      "target_id": "lta-mrt-NS22",
      "relation": "AFFECTS",
      "properties": {
        "evidence": "On Nov 15, 2025, when rainfall reached 45.2mm, Orchard MRT ridership increased 32% compared to dry days (LTA+NEA data)",
        "confidence_score": 0.85
      }
    }
  ]

few_shot_examples:
  - input: |
      Entities: [lta-mrt-NS22 (Orchard MRT), nea-event-2025-11-15 (45.2mm rain)]
      Text: On 15 November 2025, rainfall of 45.2mm was recorded at Changi.
      Orchard MRT saw a 32% increase in ridership that day compared to the
      average dry-day ridership of 85,000.
    output: |
      [{"source_id":"nea-event-2025-11-15","target_id":"lta-mrt-NS22","relation":"AFFECTS","properties":{"evidence":"45.2mm rainfall on Nov 15 correlated with 32% ridership increase at Orchard MRT vs avg dry day (85,000)","confidence_score":0.85}}]

  - input: |
      Entities: [lta-mrt-EW24 (Jurong East MRT), lta-mrt-NS24 (Dhoby Ghaut MRT)]
      Text: Jurong East MRT is connected to Dhoby Ghaut MRT via the North South Line.
    output: |
      []

user: |
  Existing entities:
  {entities}

  Text description:
  {text}

  Extract all AFFECTS and CORRELATES_WITH relationships:
