# =============================================================================
# Docker Compose: UrbanGraph-SG
# =============================================================================
# Usage:
#   docker compose up --build -d     # Start services
#   docker compose down              # Stop services
#   docker compose logs -f           # Follow logs
# =============================================================================

version: "3.8"

services:
  neo4j:
    build:
      context: .
      dockerfile: docker/neo4j.Dockerfile
    container_name: urbangraph-neo4j
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-urbangraph-sg-dev}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 500M
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - urbangraph-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "$${NEO4J_PASSWORD:-urbangraph-sg-dev}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: urbangraph-ui
    ports:
      - "8502:8502"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-urbangraph-sg-dev}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - urbangraph-net
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  urbangraph-net:
    driver: bridge
